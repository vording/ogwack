<title>大喜利道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 寄席の高座。1台のスマホを回すパーティーゲーム。上に状況、中央に1枚の札(画面ごとの主役)、下に座布団の山。1カラム、最大 560px */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #1d1a2b;
  --muted: #5f5b72;
  --line: #d7d6e3;
  --zabuton: #6a3d9a;
  --zabuton-edge: #4b2775;
  --tassel: #d4a017;
  --shu: #c8402f;
  --shu-soft: #fbe9e6;
  --quote: #f3eff9;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141f; --surface: #211e2e; --ink: #ece9f5; --muted: #a8a3bd; --line: #3a3550;
    --zabuton: #9a6fd0; --zabuton-edge: #6d47a3; --tassel: #e6b838; --shu: #ef6a57; --shu-soft: #3a2320; --quote: #2a2540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141f; --surface: #211e2e; --ink: #ece9f5; --muted: #a8a3bd; --line: #3a3550;
  --zabuton: #9a6fd0; --zabuton-edge: #6d47a3; --tassel: #e6b838; --shu: #ef6a57; --shu-soft: #3a2320; --quote: #2a2540;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, .display { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--tassel); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 1.6rem; letter-spacing: 0.04em; }
.brand small { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; }
.status { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); }

/* 札 */
.fuda { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 22px 20px 20px; position: relative; display: flex; flex-direction: column; gap: 14px; }
.fuda > .label { position: absolute; top: -13px; left: 16px; background: var(--shu); color: #fff; font-size: 0.78rem; font-weight: 700; padding: 1px 10px; border-radius: 3px; letter-spacing: 0.12em; }
.fuda h2 { font-size: 1.3rem; line-height: 1.55; }
.big { font-size: 1.5rem; line-height: 1.5; font-family: var(--display); text-wrap: balance; white-space: pre-wrap; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 0.88rem; }
.who { font-family: var(--display); color: var(--zabuton); font-size: 1.15rem; }

.btn { border: 0; border-radius: 999px; padding: 11px 22px; font-weight: 700; background: var(--zabuton); color: #fff; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; padding: 7px 14px; font-size: 0.88rem; }
.btn.ghost:hover { border-color: var(--muted); }
.btn.shu { background: var(--shu); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

textarea, input[type="text"] {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  padding: 12px 14px; font: inherit; line-height: 1.6;
}
textarea { min-height: 100px; resize: vertical; }

/* 参加者 */
.players { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; gap: 8px; align-items: center; }
.prow input { flex: 1; min-width: 0; }
.prow .x { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 6px 14px; font-size: 0.88rem; }
.seg button[aria-pressed="true"] { background: var(--zabuton); color: #fff; }

/* 座布団ボタン */
.award { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.award button { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 2px; font-size: 0.8rem; line-height: 1.3; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.award button b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.award button.minus b { color: var(--shu); }
.award button:hover { border-color: var(--zabuton); }

/* 座布団の山(得点表) */
.board { display: flex; gap: 14px; align-items: flex-end; overflow-x: auto; padding: 8px 2px 4px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; flex: 1; }
.pile { display: flex; flex-direction: column-reverse; align-items: center; min-height: 12px; }
.zb { width: 64px; height: 12px; border-radius: 6px; margin-top: -2px; background: linear-gradient(var(--zabuton), var(--zabuton-edge)); box-shadow: 0 1px 0 rgba(0,0,0,.18); position: relative; }
.zb::before, .zb::after { content: ""; position: absolute; top: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--tassel); }
.zb::before { left: -2px; } .zb::after { right: -2px; }
.zb.new { animation: drop .5s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.floor { width: 72px; height: 3px; border-radius: 2px; background: var(--line); }
.col .nm { font-size: 0.82rem; max-width: 88px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col .pt { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--zabuton); font-size: 0.9rem; }
.col.mc .nm::after { content: " 司会"; color: var(--shu); font-size: 0.72rem; }

/* 発表 */
.list { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.list li { background: var(--quote); border-radius: 14px; padding: 10px 14px; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.list li > div { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.list .by { display: block; color: var(--muted); font-size: 0.8rem; white-space: normal; }
.list .n { flex-shrink: 0; font-weight: 700; color: var(--zabuton); font-variant-numeric: tabular-nums; }
.list .n.neg { color: var(--shu); }
.stamp { align-self: flex-start; font-family: var(--display); color: var(--shu); border: 2.5px solid var(--shu); border-radius: 6px; padding: 2px 12px; transform: rotate(-4deg); background: var(--shu-soft); }
.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.progress i.on { background: var(--zabuton); }
@media (prefers-reduced-motion: reduce) { .zb.new { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>大喜利道場</h1><small>みんなで1台</small></div>
    <div class="status" id="status"></div>
  </header>
  <main id="screen"></main>
  <section id="boardWrap" hidden>
    <div class="board" id="board" aria-label="座布団の枚数"></div>
  </section>
  <div id="quitRow"></div>
</div>

<script>
(() => {
  const ODAI = [
    "絶対に幽霊が出るのに、全然怖くない心霊スポット。その理由は?",
    "こんなコンビニは嫌だ。どんなコンビニ?",
    "宇宙人が地球に来て、最初にがっかりしたことは?",
    "100年後の運動会で行われている新競技とは?",
    "「この人、絶対に転職したばかりだな」と思った瞬間とは?",
    "忍者の履歴書。特技の欄に書いてあったことは?",
    "全然売れないおみくじ。何が書いてある?",
    "猫が人間に対して、密かに思っていることは?",
    "ロボットが初めて「疲れた」と言った。その理由は?",
    "魔王が勇者に送った、ちょっと気まずいメールの内容は?",
    "世界一やる気のないカーナビ。何と言った?",
    "雪だるまが春に向けて準備していることは?",
    "新しくできた祝日「○○の日」。何をする日?",
    "天気予報士がつい本音を言ってしまった。何と言った?",
    "冷蔵庫が家族会議に参加。どんな意見を言った?",
    "校長先生の話が今日だけ短かった。その理由は?",
    "「このラーメン屋、こだわりが強すぎる」どんなこだわり?",
    "タイムマシンができたのに誰も使わない。その理由は?",
    "異世界に転生したのに全然チートじゃなかった。どんな能力?",
    "名探偵が犯人を見つけたのに言い出せない。その理由は?",
    "自動販売機が売り切れランプでこっそり伝えたいことは?",
    "ペンギンが空を飛べない本当の理由は?",
    "引っ越し業者が思わず二度見した荷物とは?",
    "図書館の「静かに」の貼り紙。よく見たら何て書いてある?",
    "RPGの村人Aが、実は毎日悩んでいることは?",
    "「この美術館、何かおかしい」どこがおかしい?",
    "サンタクロースが今年からやめたことは?",
    "家の鍵が急にしゃべり出した。最初のひとことは?",
    "「この先生、絶対に元ヤンキーだな」と思った瞬間とは?",
    "地球最後の日、コンビニの店員さんが言ったことは?"
  ];
  const AWARDS = [[-1, "没収"], [0, "なし"], [1, "1枚"], [2, "2枚"], [3, "3枚"]];
  const KEY = "ogiri-party-v1";
  const $ = (id) => document.getElementById(id);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function btn(text, cls, onclick) { const b = el("button", "btn" + (cls ? " " + cls : ""), text); b.type = "button"; b.onclick = onclick; return b; }

  let st;
  const blank = () => ({ phase: "setup", names: ["", "", ""], laps: 1, players: [], round: 0, totalRounds: 0, deck: [], odai: "", order: [], ai: 0, answers: {}, judgeOrder: [], ji: 0, awards: {}, history: [], lastGain: {} });

  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
  function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); return s && s.phase ? s : null; } catch { return null; } }
  window.claude?.hot?.snapshot?.(() => ({ st }));

  const mc = () => st.players[st.round % st.players.length];
  const score = (p) => st.history.reduce((s, r) => s + (r.awards[p] || 0), 0) + (st.phase === "reveal" ? 0 : 0);
  const nextOdai = () => { if (!st.deck.length) st.deck = shuffle(ODAI); return st.deck.shift(); };

  function go(phase) { st.phase = phase; save(); render(); window.scrollTo({ top: 0 }); }

  function renderBoard(animate) {
    const show = st.players.length && st.phase !== "setup";
    $("boardWrap").hidden = !show;
    if (!show) return;
    const b = $("board"); b.textContent = "";
    st.players.forEach((p) => {
      const c = el("div", "col" + (st.phase !== "final" && p === mc() ? " mc" : ""));
      const pile = el("div", "pile");
      const n = Math.max(0, score(p));
      const gain = animate ? Math.max(0, st.lastGain[p] || 0) : 0;
      for (let i = 0; i < Math.min(n, 30); i++) { const z = el("div", "zb" + (i >= n - gain ? " new" : "")); if (i >= n - gain) z.style.animationDelay = (i - (n - gain)) * 0.12 + "s"; pile.appendChild(z); }
      c.appendChild(pile); c.appendChild(el("div", "floor"));
      c.appendChild(el("div", "nm", p)); c.appendChild(el("div", "pt", score(p) + "枚"));
      b.appendChild(c);
    });
  }

  function status() {
    const s = $("status"); s.textContent = "";
    if (st.phase === "setup" || st.phase === "final") return;
    s.appendChild(document.createTextNode("第 ")); s.appendChild(el("b", null, String(st.round + 1)));
    s.appendChild(document.createTextNode(" / " + st.totalRounds + " 問 ｜ 司会 ")); s.appendChild(el("b", null, mc()));
  }

  // ---------- 画面 ----------
  function setup() {
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "準備"));
    f.appendChild(el("h2", null, "1台のスマホを回して遊ぶ大喜利"));
    f.appendChild(el("p", "muted", "毎問、司会が交代します。司会以外の人が順番にこっそり回答し、最後に司会が名前を伏せたまま読み上げて座布団を配ります。座布団を一番多く集めた人の優勝です。"));
    f.lastChild.style.margin = "0";
    const list = el("div", "players");
    st.names.forEach((n, i) => {
      const r = el("div", "prow");
      const inp = el("input"); inp.type = "text"; inp.id = "p" + i; inp.maxLength = 12; inp.placeholder = "プレイヤー" + (i + 1); inp.value = n;
      inp.oninput = () => { st.names[i] = inp.value; save(); check(); };
      r.appendChild(inp);
      if (st.names.length > 2) { const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "削除"); x.onclick = () => { st.names.splice(i, 1); save(); render(); }; r.appendChild(x); }
      list.appendChild(r);
    });
    f.appendChild(list);
    const add = btn("+ 参加者を追加", "ghost", () => { st.names.push(""); save(); render(); $("p" + (st.names.length - 1))?.focus(); });
    add.disabled = st.names.length >= 8;
    const seg = el("div", "seg"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "何周するか");
    [1, 2].forEach((l) => { const b = el("button", null, l + "周"); b.type = "button"; b.setAttribute("aria-pressed", String(st.laps === l)); b.onclick = () => { st.laps = l; save(); render(); }; seg.appendChild(b); });
    const r1 = el("div", "row between"); r1.appendChild(add);
    const lapWrap = el("div", "row"); lapWrap.appendChild(el("span", "muted", "司会を")); lapWrap.appendChild(seg); r1.appendChild(lapWrap);
    f.appendChild(r1);
    const msg = el("div", "muted"); const start = btn("はじめる", "shu", begin);
    const r2 = el("div", "row between"); r2.appendChild(msg); r2.appendChild(start); f.appendChild(r2);
    function check() {
      const names = st.names.map((s) => s.trim()).filter(Boolean);
      const dup = new Set(names).size !== names.length;
      start.disabled = names.length < 2 || dup;
      msg.textContent = dup ? "同じ名前があります" : names.length < 2 ? "2人以上の名前を入れてください" : names.length + "人・全" + names.length * st.laps + "問";
    }
    check();
    return f;
  }

  function begin() {
    const names = st.names.map((s) => s.trim()).filter(Boolean);
    Object.assign(st, { players: names, round: 0, totalRounds: names.length * st.laps, deck: shuffle(ODAI), history: [], lastGain: {} });
    newRound();
  }

  function newRound() {
    st.odai = nextOdai();
    const m = mc(); const i = st.players.indexOf(m);
    st.order = st.players.slice(i + 1).concat(st.players.slice(0, i)); // 司会の次の人から
    st.ai = 0; st.answers = {}; st.awards = {};
    go("odai");
  }

  function odai() {
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "お題"));
    f.appendChild(el("div", "muted", "司会:" + mc() + " さん。お題を読み上げてください。"));
    const h = el("h2", null, st.odai); f.appendChild(h);
    const edit = el("textarea"); edit.id = "customOdai"; edit.maxLength = 120; edit.placeholder = "自分でお題を書く"; edit.hidden = true; edit.style.minHeight = "72px";
    f.appendChild(edit);
    const r = el("div", "row");
    r.appendChild(btn("別のお題", "ghost", () => { st.odai = nextOdai(); save(); h.textContent = st.odai; }));
    const own = btn("自分でお題を書く", "ghost", () => { edit.hidden = !edit.hidden; if (!edit.hidden) edit.focus(); });
    r.appendChild(own);
    f.appendChild(r);
    const r2 = el("div", "row end");
    r2.appendChild(btn("回答スタート", "shu", () => { const c = edit.value.trim(); if (!edit.hidden && c) st.odai = c; go("pass"); }));
    f.appendChild(r2);
    return f;
  }

  function pass() {
    const who = st.order[st.ai];
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "回答 " + (st.ai + 1) + "/" + st.order.length));
    f.appendChild(progress(st.ai, st.order.length));
    f.appendChild(el("div", "muted", "スマホを渡してください"));
    f.appendChild(el("div", "big", who + " さん"));
    f.appendChild(el("p", "muted", "ほかの人に画面が見えないようにしてから押してください。")).style.margin = "0";
    const r = el("div", "row end"); r.appendChild(btn(who + " です。回答する", "", () => go("answer"))); f.appendChild(r);
    return f;
  }

  function answer() {
    const who = st.order[st.ai];
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "お題"));
    f.appendChild(el("h2", null, st.odai));
    f.appendChild(el("div", "who", who + " さんの回答"));
    const t = el("textarea"); t.id = "ans"; t.maxLength = 200; t.placeholder = "ここに回答を書く(名前は伏せて読み上げられます)";
    t.value = st.answers[who] || "";
    f.appendChild(t);
    const send = btn("提出して次の人へ", "shu", submit);
    const r = el("div", "row between");
    r.appendChild(btn("パスする", "ghost", () => { delete st.answers[who]; advance(); }));
    r.appendChild(send); f.appendChild(r);
    const sync = () => { send.disabled = !t.value.trim(); };
    t.oninput = sync; sync();
    t.onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } };
    function submit() { const v = t.value.trim(); if (!v) return; st.answers[who] = v; advance(); }
    setTimeout(() => t.focus(), 0);
    return f;
  }

  function advance() {
    st.ai++;
    if (st.ai < st.order.length) return go("pass");
    st.judgeOrder = shuffle(Object.keys(st.answers)); st.ji = 0;
    go(st.judgeOrder.length ? "handMc" : "reveal");
  }

  function handMc() {
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "審査"));
    f.appendChild(el("div", "muted", "全員の回答がそろいました。スマホを司会に渡してください"));
    f.appendChild(el("div", "big", mc() + " さん"));
    f.appendChild(el("p", "muted", "回答を名前を伏せて1つずつ表示します。声に出して読み上げて、座布団を配ってください。")).style.margin = "0";
    const r = el("div", "row end"); r.appendChild(btn("審査をはじめる", "shu", () => go("judge"))); f.appendChild(r);
    return f;
  }

  function judge() {
    const who = st.judgeOrder[st.ji];
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "回答 " + (st.ji + 1) + "/" + st.judgeOrder.length));
    f.appendChild(progress(st.ji, st.judgeOrder.length));
    f.appendChild(el("div", "muted", st.odai));
    f.appendChild(el("div", "big", st.answers[who]));
    f.appendChild(el("div", "muted", "座布団は何枚?"));
    const g = el("div", "award");
    AWARDS.forEach(([n, label]) => {
      const b = el("button", n < 0 ? "minus" : ""); b.type = "button";
      b.appendChild(el("b", null, n > 0 ? "+" + n : n < 0 ? "−1" : "0")); b.appendChild(el("span", null, label));
      b.onclick = () => { st.awards[who] = n; st.ji++; st.ji < st.judgeOrder.length ? go("judge") : go("reveal"); };
      g.appendChild(b);
    });
    f.appendChild(g);
    if (st.ji > 0) { const r = el("div", "row"); r.appendChild(btn("ひとつ前に戻る", "ghost", () => { st.ji--; go("judge"); })); f.appendChild(r); }
    return f;
  }

  function reveal() {
    if (!st._committed) {
      st.history.push({ odai: st.odai, mc: mc(), answers: { ...st.answers }, awards: { ...st.awards } });
      st.lastGain = { ...st.awards }; st._committed = true; save();
    }
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "発表"));
    f.appendChild(el("h2", null, st.odai));
    const ul = el("ul", "list");
    const entries = Object.keys(st.answers).sort((a, b) => (st.awards[b] ?? 0) - (st.awards[a] ?? 0));
    if (!entries.length) f.appendChild(el("p", "muted", "全員パスでした。"));
    entries.forEach((p) => {
      const li = el("li"); const d = el("div");
      d.appendChild(el("span", "by", p)); d.appendChild(document.createTextNode(st.answers[p]));
      const n = st.awards[p] ?? 0;
      li.appendChild(d); li.appendChild(el("span", "n" + (n < 0 ? " neg" : ""), n < 0 ? "没収" : n + "枚"));
      ul.appendChild(li);
    });
    if (entries.length) {
      const top = entries[0];
      if ((st.awards[top] ?? 0) > 0 && entries.filter((p) => st.awards[p] === st.awards[top]).length === 1) f.appendChild(el("div", "stamp", "この問の一本:" + top));
    }
    f.appendChild(ul);
    const last = st.round + 1 >= st.totalRounds;
    const r = el("div", "row end");
    r.appendChild(btn(last ? "最終結果へ" : "次のお題へ(司会交代)", "shu", () => {
      st._committed = false; st.lastGain = {};
      if (last) return go("final");
      st.round++; newRound();
    }));
    f.appendChild(r);
    return f;
  }

  function final() {
    const ranking = st.players.slice().sort((a, b) => score(b) - score(a));
    const f = el("div", "fuda"); f.appendChild(el("span", "label", "結果"));
    const top = score(ranking[0]); const winners = ranking.filter((p) => score(p) === top);
    f.appendChild(el("div", "muted", "優勝"));
    f.appendChild(el("div", "big", winners.join("・") + " さん"));
    const ul = el("ul", "list");
    ranking.forEach((p, i) => {
      const rank = ranking.findIndex((q) => score(q) === score(p)) + 1;
      const li = el("li"); li.appendChild(el("div", null, rank + "位 " + p)); li.appendChild(el("span", "n", score(p) + "枚")); ul.appendChild(li);
    });
    f.appendChild(ul);
    let best = null;
    st.history.forEach((r) => Object.keys(r.answers).forEach((p) => { const n = r.awards[p] ?? 0; if (n > 0 && (!best || n > best.n)) best = { p, n, a: r.answers[p], o: r.odai }; }));
    if (best) {
      f.appendChild(el("div", "stamp", "本日の一本"));
      const q = el("ul", "list"); const li = el("li"); const d = el("div");
      d.appendChild(el("span", "by", best.p + "(お題:" + best.o + ")")); d.appendChild(document.createTextNode(best.a));
      li.appendChild(d); li.appendChild(el("span", "n", best.n + "枚")); q.appendChild(li); f.appendChild(q);
    }
    const r = el("div", "row between");
    r.appendChild(btn("メンバーを変える", "ghost", () => { const names = st.players.slice(); st = blank(); st.names = names; go("setup"); }));
    r.appendChild(btn("同じメンバーでもう一回", "shu", () => { st.names = st.players.slice(); begin(); }));
    f.appendChild(r);
    return f;
  }

  function progress(i, n) { const p = el("div", "progress"); for (let k = 0; k < n; k++) p.appendChild(el("i", k < i ? "on" : "")); return p; }

  const SCREENS = { setup, odai, pass, answer, handMc, judge, reveal, final };
  function render() {
    const s = $("screen"); s.textContent = ""; $("quitRow").textContent = "";
    s.appendChild((SCREENS[st.phase] || setup)());
    status();
    renderBoard(st.phase === "reveal");
    if (st.phase !== "setup" && st.phase !== "final") {
      const quit = btn("ゲームをやめて最初に戻る", "ghost", () => { quit.hidden = true; sure.hidden = false; });
      const sure = btn("本当にやめる", "ghost", () => { const names = st.players.slice(); st = blank(); st.names = names.length ? names : ["", "", ""]; go("setup"); });
      sure.hidden = true;
      const r = el("div", "row end"); r.appendChild(quit); r.appendChild(sure); $("quitRow").appendChild(r);
    }
  }

  function boot(data) { st = (data && data.st) || load() || blank(); render(); }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
