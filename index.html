<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="お題に答えると自動で採点して講評し、座布団がもらえる、ひとり用の大喜利5問勝負。">
<title>大喜利道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 寄席の高座。上に座布団の山と番付、中央にお題札、下に回答と師匠の講評。1カラム、最大 640px */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #1d1a2b;
  --muted: #5f5b72;
  --line: #d7d6e3;
  --zabuton: #6a3d9a;
  --zabuton-edge: #4b2775;
  --tassel: #d4a017;
  --shu: #c8402f;
  --shu-soft: #fbe9e6;
  --quote: #f3eff9;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16141f; --surface: #211e2e; --ink: #ece9f5; --muted: #a8a3bd; --line: #3a3550;
    --zabuton: #9a6fd0; --zabuton-edge: #6d47a3; --tassel: #e6b838; --shu: #ef6a57; --shu-soft: #3a2320; --quote: #2a2540;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16141f; --surface: #211e2e; --ink: #ece9f5; --muted: #a8a3bd; --line: #3a3550;
  --zabuton: #9a6fd0; --zabuton-edge: #6d47a3; --tassel: #e6b838; --shu: #ef6a57; --shu-soft: #3a2320; --quote: #2a2540;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--tassel); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 1.6rem; letter-spacing: 0.04em; }
.brand small { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; }
.status { display: flex; gap: 14px; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); font-size: 1.05rem; }

.stage { display: flex; align-items: flex-end; gap: 16px; }
.pilebox { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pile { display: flex; flex-direction: column-reverse; align-items: center; min-height: 28px; width: 112px; }
.zb { width: 104px; height: 16px; border-radius: 7px; margin-top: -3px; background: linear-gradient(var(--zabuton), var(--zabuton-edge)); box-shadow: 0 1px 0 rgba(0,0,0,.18); position: relative; }
.zb::before, .zb::after { content: ""; position: absolute; top: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--tassel); }
.zb::before { left: -2px; } .zb::after { right: -2px; }
.zb.new { animation: drop .5s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes drop { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
.floor { width: 112px; height: 4px; border-radius: 2px; background: var(--line); }
.rank { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; }
.rank b { color: var(--zabuton); font-family: var(--display); font-weight: 400; font-size: 1rem; }

.fuda { flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 18px 20px 20px; position: relative; }
.fuda .label { position: absolute; top: -13px; left: 16px; background: var(--shu); color: #fff; font-size: 0.78rem; font-weight: 700; padding: 1px 10px; border-radius: 3px; letter-spacing: 0.12em; }
.fuda h2 { font-size: 1.3rem; line-height: 1.55; }
.fuda .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
@media (max-width: 520px) {
  .stage { flex-direction: column-reverse; align-items: stretch; }
  .pilebox { flex-direction: row; justify-content: center; gap: 14px; }
  .floor { display: none; }
}

.btn { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; background: var(--zabuton); color: #fff; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; padding: 7px 14px; font-size: 0.88rem; }
.btn.ghost:hover { border-color: var(--muted); }
.btn.shu { background: var(--shu); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

.answer { display: flex; flex-direction: column; gap: 10px; }
.answer label { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.06em; }
textarea { width: 100%; min-height: 96px; resize: vertical; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 14px 16px; font: inherit; line-height: 1.7; }
.hint { font-size: 0.8rem; color: var(--muted); }

.thread { display: flex; flex-direction: column; gap: 18px; }
.mine { align-self: flex-end; max-width: 85%; background: var(--quote); border-radius: 20px; padding: 12px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.judge { display: flex; flex-direction: column; gap: 12px; }
.reaction { font-size: 1.05rem; }
.verdict { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.stamp { font-family: var(--display); color: var(--shu); border: 2.5px solid var(--shu); border-radius: 6px; padding: 2px 12px; transform: rotate(-4deg); font-size: 1.05rem; background: var(--shu-soft); }
.meters { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--muted); }
.meter { display: flex; align-items: center; gap: 6px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--zabuton); }
.judge h3 { font-family: var(--display); font-weight: 400; font-size: 1.05rem; margin: 4px 0 0; }
.points { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
blockquote { margin: 0; border-left: 4px solid var(--line); padding: 4px 0 4px 16px; white-space: pre-wrap; }
.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

.result { background: var(--surface); border-radius: 18px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; border: 1.5px solid var(--line); }
.result h2 { font-size: 1.6rem; }
.result table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.result td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.result td.n { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--zabuton); font-weight: 700; text-align: right; }
.result .q { color: var(--muted); font-size: 0.8rem; display: block; }
.chip { border: 1.5px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.timer { position: absolute; top: -13px; right: 16px; background: var(--surface); border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; font-weight: 700; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.timer.low { color: var(--shu); border-color: var(--shu); animation: tick 1s ease-in-out infinite; }
.timeup { font-family: var(--display); color: var(--shu); font-size: 1.2rem; animation: slam .5s cubic-bezier(.3,1.5,.5,1) both; display: inline-block; transform: rotate(-3deg); }
.medalrow { display: flex; align-items: center; gap: 14px; }
.medal { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.5rem; color: #3a2a00; flex-shrink: 0;
  background: radial-gradient(circle at 35% 30%, #fff8 0 18%, transparent 19%), var(--m); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.15); animation: zoomIn .7s cubic-bezier(.2,1.6,.4,1) .35s both; }
.medal.gold { --m: #e2b33a; } .medal.silver { --m: #b9bcc6; } .medal.bronze { --m: #c98a52; } .medal.none { --m: var(--line); color: var(--muted); font-size: 0.85rem; }
@keyframes tick { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

/* ---------- アニメーション ---------- */
.top { animation: rise .5s ease-out both; }
.fuda { animation: fudaIn .6s cubic-bezier(.2,1.2,.4,1) .1s both; transform-origin: 50% 0; }
.fuda.flip { animation: flip .45s ease-in-out both; }
.pilebox { animation: rise .5s ease-out .25s both; }
.answer, #nav { animation: rise .45s ease-out both; }
.btn { transition: transform .12s ease, filter .15s ease, box-shadow .15s ease; }
.btn:not(:disabled):hover { transform: translateY(-1px); }
.btn:not(:disabled):active { transform: scale(.95); }
textarea { transition: border-color .2s ease, box-shadow .2s ease; }
textarea:focus { border-color: var(--zabuton); box-shadow: 0 0 0 4px color-mix(in srgb, var(--zabuton) 18%, transparent); outline: none; }
.mine.anim { animation: popIn .35s cubic-bezier(.2,1.3,.4,1) both; transform-origin: 100% 50%; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); animation: rise .3s ease-out both; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--zabuton); animation: hop .9s ease-in-out infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
.judge.anim > * { animation: rise .45s ease-out both; animation-delay: var(--d, 0s); }
.judge.anim .stamp { animation: slam .5s cubic-bezier(.3,1.5,.5,1) .25s both; }
.judge.anim .dots i.on { animation: dotOn .3s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d, 0s); }
.judge.anim .points li { animation: rise .4s ease-out both; animation-delay: var(--d, 0s); }
.verdict { position: relative; }
.burst { position: absolute; left: 50px; top: 50%; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--c); animation: burst .9s cubic-bezier(.1,.8,.3,1) .55s both; }
.judge.anim .verdict.shake { animation: shake .45s ease-in-out .55s both; }
.pop { display: inline-block; animation: rankPop .6s cubic-bezier(.3,1.6,.5,1) both; }
.result:not([hidden]) { animation: fudaIn .6s cubic-bezier(.2,1.2,.4,1) both; }
.result h2 { animation: zoomIn .7s cubic-bezier(.2,1.4,.4,1) .2s both; }
.result tr { animation: rise .4s ease-out both; animation-delay: var(--d, 0s); }
.rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.rain i { position: absolute; top: -30px; width: 46px; height: 10px; border-radius: 5px; background: linear-gradient(var(--zabuton), var(--zabuton-edge)); animation: fall var(--t, 2.4s) cubic-bezier(.4,.1,.6,1) var(--d, 0s) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fudaIn { from { opacity: 0; transform: translateY(-28px) rotate(-3deg); } to { opacity: 1; transform: none; } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes popIn { from { opacity: 0; transform: scale(.85) translateX(16px); } to { opacity: 1; transform: none; } }
@keyframes hop { 0%, 100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-6px); opacity: 1; } }
@keyframes slam { 0% { opacity: 0; transform: scale(2.6) rotate(-16deg); } 60% { opacity: 1; transform: scale(.9) rotate(-3deg); } 100% { opacity: 1; transform: rotate(-4deg); } }
@keyframes dotOn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes burst { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px) rotate(-.5deg); } 40% { transform: translateX(5px) rotate(.5deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes rankPop { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }
@keyframes zoomIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx, 0), 110vh) rotate(var(--r, 180deg)); opacity: .9; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rain, .burst { display: none; }
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><h1>大喜利道場</h1><small>ひとり稽古・5問勝負</small></div>
    <div class="status"><span>第 <b id="qnum">1</b> / 5 問</span><span>座布団 <b id="total">0</b> 枚</span><button class="chip" id="timerToggle" type="button" aria-pressed="true">4分制</button></div>
  </header>

  <section class="stage">
    <div class="fuda">
      <span class="label">お題</span>
      <span class="timer" id="timer" hidden>4:00</span>
      <h2 id="odai">…</h2>
      <div class="acts"><button class="btn ghost" id="skip" type="button">別のお題にする</button></div>
    </div>
    <div class="pilebox">
      <div class="pile" id="pile" aria-label="獲得した座布団"></div>
      <div class="floor"></div>
      <div class="rank">番付 <b id="rank">見習い</b></div>
    </div>
  </section>

  <section class="thread" id="thread" aria-live="polite"></section>

  <form class="answer" id="form">
    <label for="ans">あなたの回答</label>
    <textarea id="ans" maxlength="200"></textarea>
    <div class="row">
      <span class="hint">回答すると採点して講評します</span>
      <button class="btn" id="send" type="submit">回答する</button>
    </div>
  </form>

  <div class="row" id="nav" hidden>
    <button class="btn ghost" id="retry" type="button">同じお題でもう一回</button>
    <button class="btn shu" id="next" type="button">次のお題へ</button>
  </div>

  <section class="result" id="result" hidden></section>

</div>

<script>
(() => {
  // お題データ
  // q: お題 / t: 形式(reason=理由, thing=モノ・どんな, line=セリフ, fill=穴埋め・名前, world=世界のあるある, naru=〇〇になってみて, sonna=ツッコミ型, kashira=頭文字 k)
  // p: お題の状況の向き(+ = 楽しい・めでたい状況, - = 不幸・理不尽な状況, 0 = どちらでもない, w = あるあるを求める世界お題)
  // f: ファンタジー・非日常のお題(現実に引き戻すと効く) / e: お題の要素ワード / c: 誰でも最初に思いつく定番ワード / s: 師匠の一本(参考回答)
  const ODAI = [
    { q: "絶対に幽霊が出るのに、全然怖くない心霊スポット。その理由は?", f: 1, t: "reason", p: "0", e: ["幽霊", "霊", "おばけ", "出る", "出て", "トンネル", "墓", "夜"], c: ["優しい", "いい人", "いい幽霊", "かわいい", "明るい", "友達", "成仏", "昼"], s: "毎晩きっちり22時に出て、22時5分には「じゃ、また明日」と帰っていくから。" },
    { q: "おじいちゃんが一人で切り盛りしているコンビニ。どんなコンビニ?", t: "thing", p: "0", e: ["レジ", "弁当", "おでん", "ポイント", "袋", "温め", "棚", "店"], c: ["遅い", "耳が遠", "昭和", "古い", "寝て", "お釣り", "腰"], s: "レジ横のホットスナックが、全部おじいちゃんの手作りの煮物。" },
    { q: "初めて地球の空港に降り立った宇宙人。最初にがっかりしたことは?", f: 1, t: "thing", p: "0", e: ["空港", "地球", "UFO", "宇宙", "人間", "入国", "飛行機"], c: ["狭い", "汚い", "戦争", "ゴミ", "弱い", "小さい", "空気"], s: "入国審査で職業欄に「宇宙人」と書いたら、別室で2時間説明させられた。" },
    { q: "100年後の小学校の運動会。新しく追加された競技は?", t: "thing", p: "0", e: ["運動会", "競技", "リレー", "玉入れ", "綱引き", "徒競走", "親子", "先生"], c: ["ロボット", "空を飛", "宇宙", "ワープ", "AI", "VR", "瞬間移動"], s: "親子でパスワード再設定リレー。最後の走者が秘密の質問の答えを忘れる。" },
    { q: "「この人、絶対に転職したばかりだな」と思った瞬間とは?", t: "thing", p: "0", e: ["会社", "職場", "上司", "同僚", "社内", "前の"], c: ["緊張", "スーツが新し", "名刺", "迷子", "挨拶", "敬語"], s: "社内チャットのスタンプを前の会社のノリで送り、既読が3つで止まった。" },
    { q: "忍者が書いた履歴書。「特技」の欄に何と書いてあった?", f: 1, t: "fill", p: "0", e: ["特技", "忍"], c: ["手裏剣", "隠れ", "変身", "分身", "忍術", "足が速", "忍び足"], s: "特技:エクセルで行を非表示にすること。" },
    { q: "初詣で引いたおみくじ。全然うれしくない「大吉」の中身とは?", t: "thing", p: "+", e: ["大吉", "おみくじ", "願い", "待ち人", "恋愛", "仕事", "健康", "今年"], c: ["死", "不幸", "最悪", "凶", "呪"], s: "大吉。ただし今年の運は、1月2日の午前中で使い切ります。" },
    { q: "猫が飼い主に対して、こっそり思っていることは?", t: "thing", p: "0", e: ["飼い主", "猫", "人間", "ご主人"], c: ["バカ", "下僕", "ご飯", "エサ", "邪魔", "遅い"], s: "その四角い光る板、そんなに面白いなら一回だけ上に乗らせて。" },
    { q: "家事ロボットが初めて「疲れた」と言った。その理由は?", f: 1, t: "reason", p: "-", e: ["家事", "掃除", "洗濯", "料理", "ロボット", "疲れ"], c: ["充電", "電池", "バッテリー", "働きすぎ", "残業", "休みたい"], s: "毎朝「OK、〇〇」と呼ばれるたびに、本名じゃないのが地味に効いてきたから。" },
    { q: "魔王が勇者に送ってしまった、ちょっと気まずいメール。件名は?", f: 1, t: "fill", p: "0", e: ["件名", "Re", "勇者", "魔王", "城"], c: ["ごめん", "降参", "許して", "仲良く", "友達", "好き"], s: "Re:Re:Re:城の鍵の件(前回の宿代、まだ精算されていません)" },
    { q: "やる気がまったくないカーナビ。目的地に着いたときの一言は?", t: "line", p: "0", e: ["目的地", "到着", "着い", "案内", "右", "左"], c: ["知らない", "適当", "自分で", "勝手に", "めんどくさ"], s: "「はい、だいたいこの辺。あとは心で感じて」" },

      + (kasane ? 0.5 : 0) + (tanteki ? 1 : 0) - Math.min(filler.length, 2) * 0.5;
    if (kaburi) { idea -= 1.5; form -= 0.5; }

    const scores = [clamp(idea), clamp(scene), clamp(form)];
    const sum = scores[0] + scores[1] + scores[2];
    const zabuton = sum >= 13 ? 3 : sum >= 10 ? 2 : sum >= 7 ? 1 : 0;

    // ---------- 講評の組み立て ----------
    const REACT = [
      ["うーん、言いたいことは分かる!でももうひと押し。", "惜しい!方向はいいけど、まだ普通の答えに見えちゃう。", "あー、そう来たか。ただ、まだ笑いまでは届いてない。"],
      ["なるほど、そう来たか。ちょっとニヤッとした。", "おっ、悪くない。じわっとくるタイプ。", "うん、ちゃんと大喜利になってる!"],
      ["あー、いいねこれ!笑", "これは好き!画が見えた。", "いいとこ突いてくるね!笑"],
      ["うわ、これは座布団持ってけ!笑", "やられた!これは声出た。笑", "完璧。今日いちばんの一本かも。"]
    ];
    let reaction = pick(REACT[zabuton], seed);
    if (zabuton >= 2) {
      if (gap === 2) reaction += "お題の状況とのギャップが効いてる。";
      else if (hikimodoshi) reaction += "急に現実に引き戻されるのがいい。";
      else if (tanteki) reaction += "この短さで伝わるのがいい。";
      else { const hook = (num && num[0]) || life[0] || kata[0] || place[0]; if (hook) reaction += "「" + hook + "」が効いてる。"; }
    }
    if (kaburi) reaction = "さっきと同じ路線だね!笑 " + reaction;

    const points = [];
    // 発想
    if (cliche.length) points.push(["発想", "「" + cliche[0] + "」はこのお題で誰でも最初に思いつくやつ。そこから一歩ずらすか、もう片方の要素から攻めてみよう。"]);
    else if (gap === 2) points.push(["発想", (odai.p === "+" ? "めでたい状況に、あえてマイナスの出来事" : "ついてない状況なのに、本人がプラスに受け取っている") + "っていうギャップの作り方がうまい。"]);
    else if (hikimodoshi) points.push(["発想", "非日常のお題を、" + (life[0] || place[0]) + "みたいな現実の要素で引き戻してる。それだけでギャップが生まれる。"]);
    else if (odai.p === "w" && aru.length) points.push(["発想", "世界お題に対して、その世界で毎回起きそうなことを素直に答えられてる。"]);
    else if (life.length) points.push(["発想", "「" + life[0] + "」みたいな生活感のある言葉を持ち込んだのがうまい。世界のズレが笑いになってる。"]);
    else if (odaiWords.length >= 2 && len < 20) points.push(["発想", "お題の言葉をなぞっている感じがある。お題の場所や人物のところに頭の中で行って、そこにある物から要素を拾ってみよう。"]);
    else if ((elem.length || formOk) && scores[0] <= 2) points.push(["発想", "お題の条件には沿ってるけど、それだけだと誰でもたどり着く答えになりがち。お題の空気から「この人がヤバいと面白い」みたいな方向を一個決めてみよう。"]);
    else points.push(["発想", "定番は外せてる。「なんでそこ?」と言われるくらい遠い要素を持ってくると、さらに強い。"]);
    if (kaburi) points.push(["被り", "前の回答と同じ要素を使い回してる。同じ方向に2回続けて被せると「またこれか」になりやすいので、別の路線を一回挟もう。"]);

    // 情景
    const sceneBits = [num && "「" + num[0] + "」という数字", place[0] && "「" + place[0] + "」という場面", quote && "セリフ", kata[0] && "「" + kata[0] + "」", aru[0] && "「" + aru[0] + "」のあるある感", onoma && "音の言葉"].filter(Boolean);
    if (scores[1] >= 4) points.push(["情景", sceneBits.slice(0, 2).join("と") + "で、画がくっきり浮かぶ。"]);
    else if (scores[1] >= 3) points.push(["情景", (sceneBits[0] || "具体的な言葉") + "のおかげで、なんとなく画は見える。もう一個だけ具体を足したい。"]);
    else if (tanteki) points.push(["情景", "短いぶん、画は受け手の想像に任せてる。伝わればいちばん強い形。"]);
    else points.push(["情景", "まだ画がぼんやりしてる。自分が見たことあるあるあるや実体験から、「いつ・どこで・何回」を一個足すと一気に見える。"]);

    // 構成
    if (odai.t === "kashira" && formOk === false) points.push(["構成", FORM_TIP.kashira + "このお題は「" + odai.k + "」から。"]);
    else if (filler.length) points.push(["構成", "「" + filler[0] + "」は削れる言葉。大喜利の回答は、一文字でも削れるなら削ったほうがキレが出る。"]);
    else if (formOk === false && FORM_TIP[odai.t]) points.push(["構成", FORM_TIP[odai.t]]);
    else if (ochiEarly) points.push(["構成", "面白いところが前半に出ちゃってる。オチになる言葉を最後に置くと、「どう着地するんだ?」と思わせてから落とせる。"]);
    else if (len > 45) points.push(["構成", "ちょっと長い。ネット大喜利で票を集める回答は10文字前後がほとんど。説明が多いとオチまでにノイズが入るので、削れるところを削ろう。"]);
    else if (tanteki) points.push(["構成", "短く言い切ってて、受け手が想像する余白がある。説明を省くほど、伝わったときの面白さが増す。"]);
    else if (kasane) points.push(["構成", "ボケを重ねて光景に広がりを出せてる。重ねるときは最後を短い言葉で落とすとキレが増す。"]);
    else if (addOn) points.push(["構成", "最後の短い一言で、もう一段押せてる。この足し方は強い。"]);
    else if (ochiLate) points.push(["構成", "オチになる言葉がちゃんと最後に来てて、語順がいい。"]);
    else points.push(["構成", "形はできてる。味気なく感じたら、セリフをもう一言足すとか、起きそうなことをもう一歩先まで言ってみよう。"]);

    // 改善ポイント:一番弱い軸から
    const weakest = scores.indexOf(Math.min(...scores));
    const TIPS = [
      odai.p === "+" ? "楽しい・めでたい状況のお題なので、あえてマイナスなことを起こしてみよう。ギャップが一番の取っ掛かりになる。"
        : odai.p === "-" ? "ついてない状況のお題なので、本人がやたらプラスに受け取っている方向を試してみよう。ギャップが生まれる。"
        : odai.f ? "非日常のお題なので、タクシーや役所みたいな現実のあるあるを起こしてみよう。現実に引き戻すだけでギャップが生まれる。"
        : odai.p === "w" ? "世界お題は、その世界に行ってみるか、今の日本がその世界になったら何が起きるかを想像してみよう。"
        : "お題の世界で何かマイナスなことを起こしてみよう。「確定申告」「既読」みたいな、お題から遠い生活の言葉を持ち込むのも鉄板。",
      "数字や場所を入れてみよう。「たまに」より「3分おきに」、「たくさん」より「800円」のほうが画が浮かぶ。",
      len > 30 ? "削れる言葉を削ろう。短く言い切るほど、伝わったときの面白さが増す。" : "オチになる言葉を最後に回そう。思いつかなければ、小さいボケをもう一個重ねるのもあり。"
    ];
    if (zabuton < 3) points.push(["改善ポイント", TIPS[weakest]]);
    else points.push(["改善ポイント", "言うことなし!このキレを次のお題でも。"]);

    return { zabuton, scores, reaction, points, sample: odai.s };
  }

  // ---------- ゲーム進行 ----------
  const ROUNDS = 5;
  const RANKS = [[14, "名人"], [11, "真打"], [8, "二ツ目"], [4, "前座"], [0, "見習い"]];
  const VERDICT = ["座布団なし", "座布団1枚", "座布団2枚", "座布団3枚!"];
  const KEY = "ogiri-solo-v3";
  const $ = (id) => document.getElementById(id);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const allIdx = () => shuffle(ODAI.map((_, i) => i));
  const fresh = () => { const deck = allIdx(); return { deck, q: 1, cur: deck.shift(), tries: [], rounds: [], phase: "answer" }; };
  let st;
  let busy = false;
  const LIMIT = 4 * 60 * 1000;
  const OPT_KEY = "ogiri-solo-opt";
  let timerOn = (() => { try { return localStorage.getItem(OPT_KEY) !== "off"; } catch { return true; } })();
  let tickId = null;
  function startClock() { st.deadline = timerOn ? Date.now() + LIMIT : null; st.timeUp = false; }
  function tick() {
    const t = $("timer");
    const active = timerOn && st.deadline && (st.phase === "answer" || st.phase === "judged") && !st.timeUp;
    t.hidden = !(timerOn && st.phase !== "done");
    if (!active) { if (st.timeUp) { t.textContent = "0:00"; t.classList.add("low"); } return; }
    const left = Math.max(0, st.deadline - Date.now());
    const sec = Math.ceil(left / 1000);
    t.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
    t.classList.toggle("low", sec <= 30);
    if (left <= 0 && !busy) timeUp();
  }
  function timeUp() {
    st.timeUp = true; st.phase = "judged"; save(); render();
  }
  const REDUCED = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch { return false; } })();
  const wait = (ms) => new Promise((r) => setTimeout(r, REDUCED ? 0 : ms));
  function restart(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function countUp(node, from, to, delay) {
    if (REDUCED || from === to) { node.textContent = to; return; }
    setTimeout(() => {
      const t0 = performance.now(), dur = 500;
      const step = (now) => { const k = Math.min(1, (now - t0) / dur); node.textContent = Math.round(from + (to - from) * k); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    }, delay);
  }
  function burst(host, n) {
    if (REDUCED) return;
    const b = el("span", "burst");
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * 0.4, r = 50 + Math.random() * 60;
      const p = el("i"); p.style.setProperty("--dx", Math.cos(a) * r + "px"); p.style.setProperty("--dy", Math.sin(a) * r + "px");
      p.style.setProperty("--r", Math.round(Math.random() * 360) + "deg"); p.style.setProperty("--c", i % 3 ? "var(--zabuton)" : "var(--tassel)");
      b.appendChild(p);
    }
    host.appendChild(b); setTimeout(() => b.remove(), 1800);
  }
  function rain(n) {
    if (REDUCED || n <= 0) return;
    const r = el("div", "rain");
    for (let i = 0; i < Math.min(n * 4, 60); i++) {
      const z = el("i"); z.style.left = Math.random() * 100 + "%"; z.style.setProperty("--d", (Math.random() * 1.6).toFixed(2) + "s");
      z.style.setProperty("--t", (1.8 + Math.random() * 1.4).toFixed(2) + "s"); z.style.setProperty("--dx", (Math.random() * 120 - 60) + "px"); z.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
      r.appendChild(z);
    }
    document.body.appendChild(r); setTimeout(() => r.remove(), 5000);
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} }
  function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); return s && typeof s.cur === "number" && ODAI[s.cur] ? s : null; } catch { return null; } }

  const odai = () => ODAI[st.cur];
  const best = () => st.tries.reduce((m, t) => Math.max(m, t.zabuton), 0);
  const total = () => st.rounds.reduce((s, r) => s + r.best, 0) + (st.phase === "done" ? 0 : best());
  const rankOf = (n) => RANKS.find(([min]) => n >= min)[1];
  const drawNext = () => { if (!st.deck.length) st.deck = allIdx(); return st.deck.shift(); };

  function renderPile(from, delay = 0) {
    const pile = $("pile"); pile.textContent = "";
    const n = total();
    for (let i = 0; i < n; i++) { const isNew = from != null && i >= from; const z = el("div", "zb" + (isNew ? " new" : "")); if (isNew) z.style.animationDelay = delay + (i - from) * 0.15 + "s"; pile.appendChild(z); }
    const prevRank = $("rank").textContent;
    if (from != null && n !== from) countUp($("total"), from, n, delay * 1000); else $("total").textContent = n;
    $("rank").textContent = rankOf(n);
    if (from != null && prevRank !== rankOf(n)) setTimeout(() => restart($("rank"), "pop"), delay * 1000 + 300);
  }

  function renderTry(t, last, anim) {
    const f = document.createDocumentFragment();
    f.appendChild(el("div", "mine", t.answer));
    const g = t.result, j = el("div", "judge" + (anim ? " anim" : ""));
    j.appendChild(el("div", "reaction", g.reaction));
    const v = el("div", "verdict"); v.appendChild(el("span", "stamp", VERDICT[g.zabuton]));
    const m = el("div", "meters");
    ["発想", "情景", "構成"].forEach((k, i) => { const mm = el("span", "meter"); mm.appendChild(el("span", null, k)); const d = el("span", "dots"); for (let n = 1; n <= 5; n++) { const dot = el("i", n <= g.scores[i] ? "on" : ""); dot.style.setProperty("--d", (0.6 + i * 0.25 + n * 0.07).toFixed(2) + "s"); d.appendChild(dot); } mm.appendChild(d); m.appendChild(mm); });
    v.appendChild(m); j.appendChild(v);
    const h = el("h3", null, "講評"); h.style.setProperty("--d", "1.3s"); j.appendChild(h);
    const ul = el("ul", "points"); ul.style.setProperty("--d", "1.3s");
    g.points.forEach(([k, text], i) => { const li = el("li"); li.style.setProperty("--d", (1.4 + i * 0.18).toFixed(2) + "s"); li.appendChild(el("b", null, k + ":")); li.appendChild(document.createTextNode(text)); ul.appendChild(li); });
    j.appendChild(ul);
    if (last && t.showSample) {
      const sd = (1.5 + g.points.length * 0.18).toFixed(2) + "s";
      const a = el("h3", null, "回答例"); a.style.setProperty("--d", sd); j.appendChild(a);
      const q = el("blockquote", null, g.sample); q.style.setProperty("--d", sd); j.appendChild(q);
    }
    if (anim && g.zabuton === 3) { burst(v, 18); v.classList.add("shake"); }
    f.appendChild(j);
    return f;
  }

  function render(animLast) {
    $("odai").textContent = odai().q;
    $("qnum").textContent = Math.min(st.q, ROUNDS);
    const th = $("thread"); th.textContent = "";
    st.tries.forEach((t, i) => { if (i) th.appendChild(el("hr", "sep")); th.appendChild(renderTry(t, i === st.tries.length - 1, animLast && i === st.tries.length - 1)); });
    const done = st.phase === "done";
    $("form").hidden = done || st.phase === "judged";
    $("nav").hidden = done || st.phase !== "judged";
    $("retry").hidden = !!st.timeUp;
    if (st.timeUp && !done) { const n = el("div", null); n.appendChild(el("span", "timeup", "時間切れ!")); if (!st.tries.length) n.appendChild(el("div", "hint", "このお題は座布団なしです。")); th.appendChild(n); }
    tick();
    $("result").hidden = !done;
    $("skip").disabled = st.tries.length > 0 || !!st.timeUp;
    $("next").textContent = st.q >= ROUNDS ? "結果を見る" : "次のお題へ";
    if (done) renderResult();
  }

  async function submit() {
    const answer = $("ans").value.trim();
    if (!answer || busy) return;
    busy = true; $("send").disabled = true;
    const before = total();
    const result = judge(answer, odai(), st.tries.map((t) => t.answer));
    // 回答の吹き出しと「師匠が考え中」を先に出す
    const th = $("thread");
    if (st.tries.length) th.appendChild(el("hr", "sep"));
    th.appendChild(el("div", "mine anim", answer));
    const think = el("div", "thinking"); think.appendChild(el("i")); think.appendChild(el("i")); think.appendChild(el("i")); think.appendChild(el("span", null, "採点中…"));
    th.appendChild(think);
    $("ans").value = ""; $("form").hidden = true;
    think.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "nearest" });
    await wait(900);
    st.tries.push({ answer, zabuton: result.zabuton, result, showSample: st.tries.length >= 1 || result.zabuton < 2 });
    st.phase = "judged"; if (timerOn && st.deadline && Date.now() >= st.deadline) st.timeUp = true; save();
    render(true); renderPile(before, REDUCED ? 0 : 0.7);
    busy = false; $("send").disabled = false;
    th.lastElementChild?.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "nearest" });
  }
  function flipOdai(change) {
    const f = document.querySelector(".fuda");
    if (REDUCED) { change(); return; }
    restart(f, "flip"); setTimeout(change, 220);
  }

  function nextRound() {
    st.rounds.push({ q: odai().q, tries: st.tries.map(({ answer, zabuton }) => ({ answer, zabuton })), best: best() });
    st.tries = [];
    if (st.q >= ROUNDS) { st.phase = "done"; save(); render(); renderPile(); rain(total()); return; }
    st.q++; st.cur = drawNext(); st.phase = "answer"; startClock(); save();
    window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
    flipOdai(() => { render(); renderPile(); $("ans").focus(); });
  }

  function renderResult() {
    const box = $("result"); box.textContent = "";
    const n = total();
    const medal = n >= 13 ? ["gold", "金"] : n >= 10 ? ["silver", "銀"] : n >= 7 ? ["bronze", "銅"] : ["none", "参加"];
    const mr = el("div", "medalrow"); mr.appendChild(el("div", "medal " + medal[0], medal[1]));
    const mt = el("div"); mt.appendChild(el("div", "rank", "最終番付")); mt.appendChild(el("h2", null, rankOf(n) + "・座布団 " + n + " 枚"));
    mr.appendChild(mt); box.appendChild(mr);
    const tbl = el("table");
    st.rounds.forEach((r, i) => {
      const b = r.tries.reduce((a, t) => (!a || t.zabuton > a.zabuton ? t : a), null);
      const tr = el("tr"), td = el("td");
      td.appendChild(el("span", "q", "第" + (i + 1) + "問 " + r.q));
      td.appendChild(document.createTextNode(b ? b.answer : "(回答なし)"));
      tr.style.setProperty("--d", (0.5 + i * 0.12).toFixed(2) + "s");
      tr.appendChild(td); tr.appendChild(el("td", "n", r.best + " 枚")); tbl.appendChild(tr);
    });
    box.appendChild(tbl);
    const again = el("button", "btn", "もう一度挑戦する"); again.type = "button";
    again.onclick = () => { st = fresh(); startClock(); save(); window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" }); flipOdai(() => { render(); renderPile(); }); };
    const row = el("div", "row"); row.appendChild(again); box.appendChild(row);
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  $("ans").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(); } });
  $("skip").onclick = () => { st.cur = drawNext(); startClock(); save(); flipOdai(() => render()); };
  $("timerToggle").setAttribute("aria-pressed", String(timerOn));
  $("timerToggle").onclick = () => {
    timerOn = !timerOn; try { localStorage.setItem(OPT_KEY, timerOn ? "on" : "off"); } catch {}
    $("timerToggle").setAttribute("aria-pressed", String(timerOn));
    if (timerOn && st.phase !== "done" && !st.timeUp) st.deadline = Date.now() + LIMIT;
    if (!timerOn) st.deadline = null;
    save(); tick();
  };
  $("retry").onclick = () => { st.phase = "answer"; save(); render(); $("ans").focus(); };
  $("next").onclick = nextRound;

  function boot() {
    st = load();
    if (!st) { st = fresh(); startClock(); save(); }
    if (st.deadline === undefined) startClock();
    render(); renderPile();
    clearInterval(tickId); tickId = setInterval(tick, 250);
  }
  boot();
})();
</script>
</body>
</html>
